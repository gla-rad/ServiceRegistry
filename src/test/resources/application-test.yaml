# Disable Security while testing
app:
    security:
        basic:
            enabled: false
keycloak:
    enabled: false

# Spring JPA Configuration - H2
spring:
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        generate-ddl: true
        hibernate:
            ddl-auto: create
        properties:
            hibernate:
                search:
                    backend:
                        directory:
                            root: ./lucene-test/
                        analysis:
                            configurer: >-
                                class:net.maritimeconnectivity.serviceregistry.config.MSRLuceneAnalysisConfigurer
                    schema_management:
                        strategy: none
    datasource:
        url: 'jdbc:h2:./target/testdb;DB_CLOSE_ON_EXIT=TRUE'
        username: sa
        driverClassName: org.h2.Driver
    # Disable Flyway while testing
    flyway:
        enabled: false

# Disable the lucene indexing while testing
lucene:
    indexing: false

# Disable Eureka when testing
eureka:
    client:
        enabled: false

# Service Registry Configuration
net:
    maritimeconnectivity:
        serviceregistry:
            allowedContentTypes: application/pdf

info:
    msr:
        name: ${service.variable.info.name}
        mrn: ${service.variable.info.mrn}
        url: ${service.variable.info.url}
        operatorName: ${service.variable.info.operator.name}
        operatorMrn: ${service.variable.info.operator.mrn}
        operatorContact: ${service.variable.info.operator.contact}
        operatorUrl: ${service.variable.info.operator.url}
        copyright: 'Copyright © 2025 Maritime Connectivity Platform Consortium'
        projectLocation: 'https://github.com/maritimeconnectivity/ServiceRegistry'
        profile: ${spring.profiles.active:test}
        forceCertificateCheck: true
    mms:
        mmtp:
            duration:
                minutes: 60
        router:
            url: wss://eu-router.dmc.international:8080
        ownEdgerouter:
            keyStore:
                path: <your-keystore-path>
                password: <your-keystore-password>
            rootCA:
                path:
    gmsp:
        enabled: true
        search:
            globalSubject: 'urn:mrn:mcp:msr:search:global'